[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wgan-option"
version = "0.1.0"
description = "WGAN option volatility-surface modeling toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2.1",
  "pandas>=1.5,<2.3",
  "matplotlib>=3.6,<3.9",
  "PyYAML>=6.0,<7.0",
  "scipy>=1.10,<1.12",
  "python-dateutil>=2.8,<3.0",
  "scikit-learn>=1.2,<1.4",
  "torch>=2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["wgan_option*", "quantlib*", "market_data*"]
