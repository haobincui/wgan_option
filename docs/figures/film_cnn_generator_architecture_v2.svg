<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1000" viewBox="0 0 2200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Simplified FiLM-CNN generator architecture</title>
  <desc id="desc">A concise architecture diagram emphasizing six text-conditioned FiLM modules in the encoder, bottleneck, and decoder of the implied-volatility-surface generator.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#25364A"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6F36A8"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#087F85"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill:#FFFFFF; }
      .title { font:700 43px 'DejaVu Sans',Arial,sans-serif; fill:#172033; }
      .subtitle { font:400 22px 'DejaVu Sans',Arial,sans-serif; fill:#536174; }
      .h1 { font:700 22px 'DejaVu Sans',Arial,sans-serif; fill:#172033; }
      .body { font:400 17px 'DejaVu Sans',Arial,sans-serif; fill:#344256; }
      .small { font:400 15px 'DejaVu Sans',Arial,sans-serif; fill:#4C5A6C; }
      .mono { font:600 16px 'DejaVu Sans Mono',monospace; fill:#435166; }
      .formula { font:400 25px 'DejaVu Serif',Georgia,serif; fill:#172033; }
      .formula-small { font:400 20px 'DejaVu Serif',Georgia,serif; fill:#172033; }
      .white { font:700 20px 'DejaVu Sans',Arial,sans-serif; fill:#FFFFFF; }
      .white-small { font:400 14px 'DejaVu Sans',Arial,sans-serif; fill:#FFFFFF; }
      .input { fill:#F5F7FA; stroke:#687588; stroke-width:2.6; }
      .enc { fill:#EEF6FF; stroke:#2B6CB0; stroke-width:2.6; }
      .bottleneck { fill:#EAF9F8; stroke:#178187; stroke-width:2.6; }
      .dec { fill:#FFF4E8; stroke:#D96B12; stroke-width:2.6; }
      .neutral { fill:#F7F8FA; stroke:#5D6979; stroke-width:2.6; }
      .text { fill:#F6F0FC; stroke:#6F36A8; stroke-width:2.8; }
      .film { fill:#6F36A8; stroke:#54237F; stroke-width:2.2; }
      .gamma { fill:#FFFFFF; stroke:#6F36A8; stroke-width:2.2; }
      .rule { stroke:#D7DEE8; stroke-width:1.8; }
      .forward { fill:none; stroke:#25364A; stroke-width:3.8; marker-end:url(#arrow-dark); }
      .skip { fill:none; stroke:#5A6778; stroke-width:3.2; marker-end:url(#arrow-dark); }
      .text-line { fill:none; stroke:#6F36A8; stroke-width:3.5; }
      .text-arrow { fill:none; stroke:#6F36A8; stroke-width:3.5; marker-end:url(#arrow-purple); }
      .noise-arrow { fill:none; stroke:#087F85; stroke-width:3.5; marker-end:url(#arrow-teal); }
    </style>
  </defs>

  <rect class="bg" width="2200" height="1000"/>

  <!-- Heading -->
  <text class="title" x="1100" y="55" text-anchor="middle">FiLM-CNN Generator</text>
  <text class="subtitle" x="1100" y="91" text-anchor="middle">Text conditions every CNN stage through feature-wise scale and shift</text>

  <!-- Compact text path -->
  <g filter="url(#shadow)">
    <rect class="text" x="35" y="130" width="270" height="86" rx="14"/>
    <rect class="text" x="350" y="120" width="350" height="106" rx="14"/>
    <rect class="text" x="745" y="130" width="190" height="86" rx="14"/>
    <rect x="990" y="111" width="1175" height="124" rx="16" fill="#FCFAFE" stroke="#6F36A8" stroke-width="3"/>
  </g>

  <text class="h1" x="170" y="165" text-anchor="middle">LP embedding</text>
  <text class="mono" x="170" y="197" text-anchor="middle">w<tspan baseline-shift="sub" font-size="11">t</tspan> [B,1024]</text>

  <text class="h1" x="525" y="157" text-anchor="middle">Text adapter</text>
  <text class="body" x="525" y="187" text-anchor="middle">1024 → 256 → 128</text>
  <text class="small" x="525" y="214" text-anchor="middle">LayerNorm · LeakyReLU · Dropout</text>

  <text class="h1" x="840" y="165" text-anchor="middle">Text code</text>
  <text class="mono" x="840" y="197" text-anchor="middle">e<tspan baseline-shift="sub" font-size="11">t</tspan> [B,128]</text>

  <text class="h1" x="1577.5" y="145" text-anchor="middle">FiLM at stage ℓ</text>
  <text class="formula" x="1577.5" y="182" text-anchor="middle">(γ<tspan baseline-shift="super" font-size="15">(ℓ)</tspan>, β<tspan baseline-shift="super" font-size="15">(ℓ)</tspan>) = P<tspan baseline-shift="super" font-size="15">(ℓ)</tspan>(e<tspan baseline-shift="sub" font-size="15">t</tspan>)  ·  H̃<tspan baseline-shift="super" font-size="15">(ℓ)</tspan> = (1+γ<tspan baseline-shift="super" font-size="15">(ℓ)</tspan>)⊙H<tspan baseline-shift="super" font-size="15">(ℓ)</tspan>+β<tspan baseline-shift="super" font-size="15">(ℓ)</tspan></text>
  <text class="small" x="1577.5" y="213" text-anchor="middle">Six independent projections · channel-wise broadcast · zero-initialized · followed by LeakyReLU</text>

  <path class="text-arrow" d="M305 173H350"/>
  <path class="text-arrow" d="M700 173H745"/>
  <path class="text-arrow" d="M935 173H990"/>

  <!-- FiLM distribution bus -->
  <path class="text-line" d="M840 216V287H350"/>
  <path class="text-line" d="M840 287H1500"/>

  <!-- Six gamma/beta pills -->
  <g filter="url(#shadow)">
    <rect class="gamma" x="285" y="310" width="130" height="48" rx="24"/>
    <rect class="gamma" x="505" y="310" width="130" height="48" rx="24"/>
    <rect class="gamma" x="725" y="310" width="130" height="48" rx="24"/>
    <rect class="gamma" x="955" y="310" width="130" height="48" rx="24"/>
    <rect class="gamma" x="1215" y="310" width="130" height="48" rx="24"/>
    <rect class="gamma" x="1435" y="310" width="130" height="48" rx="24"/>
  </g>
  <text class="body" x="350" y="341" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="11">E1</tspan>, β<tspan baseline-shift="sub" font-size="11">E1</tspan></text>
  <text class="body" x="570" y="341" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="11">E2</tspan>, β<tspan baseline-shift="sub" font-size="11">E2</tspan></text>
  <text class="body" x="790" y="341" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="11">E3</tspan>, β<tspan baseline-shift="sub" font-size="11">E3</tspan></text>
  <text class="body" x="1020" y="341" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="11">B</tspan>, β<tspan baseline-shift="sub" font-size="11">B</tspan></text>
  <text class="body" x="1280" y="341" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="11">D1</tspan>, β<tspan baseline-shift="sub" font-size="11">D1</tspan></text>
  <text class="body" x="1500" y="341" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="11">D2</tspan>, β<tspan baseline-shift="sub" font-size="11">D2</tspan></text>

  <path class="text-arrow" d="M350 287V310"/>
  <path class="text-arrow" d="M570 287V310"/>
  <path class="text-arrow" d="M790 287V310"/>
  <path class="text-arrow" d="M1020 287V310"/>
  <path class="text-arrow" d="M1280 287V310"/>
  <path class="text-arrow" d="M1500 287V310"/>

  <!-- Injection arrows drawn behind stage cards -->
  <path class="text-arrow" d="M350 358V548"/>
  <path class="text-arrow" d="M570 358V548"/>
  <path class="text-arrow" d="M790 358V548"/>
  <path class="text-arrow" d="M1020 358V548"/>
  <path class="text-arrow" d="M1280 358V548"/>
  <path class="text-arrow" d="M1500 358V548"/>

  <!-- Main architecture cards -->
  <g filter="url(#shadow)">
    <rect class="input" x="20" y="440" width="200" height="286" rx="15"/>
    <rect class="enc" x="260" y="420" width="180" height="306" rx="15"/>
    <rect class="enc" x="480" y="420" width="180" height="306" rx="15"/>
    <rect class="enc" x="700" y="420" width="180" height="306" rx="15"/>
    <rect class="bottleneck" x="920" y="420" width="200" height="306" rx="15"/>
    <rect class="dec" x="1190" y="420" width="180" height="306" rx="15"/>
    <rect class="dec" x="1410" y="420" width="180" height="306" rx="15"/>
    <rect class="neutral" x="1630" y="440" width="180" height="286" rx="15"/>
    <rect class="neutral" x="1850" y="440" width="330" height="286" rx="15"/>
  </g>

  <!-- Input card -->
  <text class="h1" x="120" y="480" text-anchor="middle">Current surface</text>
  <text class="mono" x="120" y="513" text-anchor="middle">[B,4,16,16]</text>
  <line class="rule" x1="45" y1="535" x2="195" y2="535"/>
  <text class="body" x="120" y="574" text-anchor="middle">masked IVS</text>
  <text class="body" x="120" y="608" text-anchor="middle">support mask</text>
  <text class="body" x="120" y="642" text-anchor="middle">moneyness</text>
  <text class="body" x="120" y="676" text-anchor="middle">log-maturity</text>

  <!-- Compact stage cards -->
  <text class="h1" x="350" y="460" text-anchor="middle">Encoder E1</text>
  <text class="body" x="350" y="501" text-anchor="middle">Conv 4→32</text>
  <rect class="film" x="276" y="548" width="148" height="66" rx="10"/>
  <text class="white" x="350" y="578" text-anchor="middle">FiLM<tspan baseline-shift="sub" font-size="12">E1</tspan></text>
  <text class="white-small" x="350" y="602" text-anchor="middle">scale + shift</text>
  <text class="small" x="350" y="648" text-anchor="middle">LeakyReLU</text>
  <text class="mono" x="350" y="691" text-anchor="middle">32 × 16²</text>

  <text class="h1" x="570" y="460" text-anchor="middle">Encoder E2</text>
  <text class="body" x="570" y="501" text-anchor="middle">Conv↓2 32→64</text>
  <rect class="film" x="496" y="548" width="148" height="66" rx="10"/>
  <text class="white" x="570" y="578" text-anchor="middle">FiLM<tspan baseline-shift="sub" font-size="12">E2</tspan></text>
  <text class="white-small" x="570" y="602" text-anchor="middle">scale + shift</text>
  <text class="small" x="570" y="648" text-anchor="middle">LeakyReLU</text>
  <text class="mono" x="570" y="691" text-anchor="middle">64 × 8²</text>

  <text class="h1" x="790" y="460" text-anchor="middle">Encoder E3</text>
  <text class="body" x="790" y="501" text-anchor="middle">Conv↓2 64→128</text>
  <rect class="film" x="716" y="548" width="148" height="66" rx="10"/>
  <text class="white" x="790" y="578" text-anchor="middle">FiLM<tspan baseline-shift="sub" font-size="12">E3</tspan></text>
  <text class="white-small" x="790" y="602" text-anchor="middle">scale + shift</text>
  <text class="small" x="790" y="648" text-anchor="middle">LeakyReLU</text>
  <text class="mono" x="790" y="691" text-anchor="middle">128 × 4²</text>

  <text class="h1" x="1020" y="460" text-anchor="middle">Bottleneck</text>
  <text class="body" x="1020" y="492" text-anchor="middle">concat z<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text class="body" x="1020" y="518" text-anchor="middle">Conv 160→128</text>
  <rect class="film" x="940" y="548" width="160" height="66" rx="10"/>
  <text class="white" x="1020" y="578" text-anchor="middle">FiLM<tspan baseline-shift="sub" font-size="12">B</tspan></text>
  <text class="white-small" x="1020" y="602" text-anchor="middle">scale + shift</text>
  <text class="small" x="1020" y="648" text-anchor="middle">LeakyReLU</text>
  <text class="mono" x="1020" y="691" text-anchor="middle">128 × 4²</text>

  <text class="h1" x="1280" y="460" text-anchor="middle">Decoder D1</text>
  <text class="body" x="1280" y="492" text-anchor="middle">↑ + skip E2</text>
  <text class="body" x="1280" y="518" text-anchor="middle">Conv 192→64</text>
  <rect class="film" x="1206" y="548" width="148" height="66" rx="10"/>
  <text class="white" x="1280" y="578" text-anchor="middle">FiLM<tspan baseline-shift="sub" font-size="12">D1</tspan></text>
  <text class="white-small" x="1280" y="602" text-anchor="middle">scale + shift</text>
  <text class="small" x="1280" y="648" text-anchor="middle">LeakyReLU</text>
  <text class="mono" x="1280" y="691" text-anchor="middle">64 × 8²</text>

  <text class="h1" x="1500" y="460" text-anchor="middle">Decoder D2</text>
  <text class="body" x="1500" y="492" text-anchor="middle">↑ + skip E1</text>
  <text class="body" x="1500" y="518" text-anchor="middle">Conv 96→32</text>
  <rect class="film" x="1426" y="548" width="148" height="66" rx="10"/>
  <text class="white" x="1500" y="578" text-anchor="middle">FiLM<tspan baseline-shift="sub" font-size="12">D2</tspan></text>
  <text class="white-small" x="1500" y="602" text-anchor="middle">scale + shift</text>
  <text class="small" x="1500" y="648" text-anchor="middle">LeakyReLU</text>
  <text class="mono" x="1500" y="691" text-anchor="middle">32 × 16²</text>

  <!-- Head and output -->
  <text class="h1" x="1720" y="480" text-anchor="middle">Residual head</text>
  <text class="body" x="1720" y="529" text-anchor="middle">1×1 Conv</text>
  <text class="body" x="1720" y="563" text-anchor="middle">32 → 1</text>
  <line class="rule" x1="1655" y1="593" x2="1785" y2="593"/>
  <text class="mono" x="1720" y="638" text-anchor="middle">Δ<tspan baseline-shift="sub" font-size="11">t</tspan></text>
  <text class="small" x="1720" y="679" text-anchor="middle">zero-initialized</text>

  <text class="h1" x="2015" y="480" text-anchor="middle">Predicted future IVS</text>
  <text class="formula-small" x="2015" y="532" text-anchor="middle">σ̂<tspan baseline-shift="sub" font-size="13">t+h</tspan> = identity-softplus(σ<tspan baseline-shift="sub" font-size="13">t</tspan>, Δ<tspan baseline-shift="sub" font-size="13">t</tspan>)</text>
  <line class="rule" x1="1882" y1="565" x2="2148" y2="565"/>
  <text class="mono" x="2015" y="614" text-anchor="middle">[B,1,16,16]</text>
  <text class="body" x="2015" y="655" text-anchor="middle">h = 5 minutes</text>
  <text class="small" x="2015" y="691" text-anchor="middle">initial forecast = persistence</text>

  <!-- Forward arrows -->
  <path class="forward" d="M220 630H260"/>
  <path class="forward" d="M440 630H480"/>
  <path class="forward" d="M660 630H700"/>
  <path class="forward" d="M880 630H920"/>
  <path class="forward" d="M1120 630H1190"/>
  <path class="forward" d="M1370 630H1410"/>
  <path class="forward" d="M1590 630H1630"/>
  <path class="forward" d="M1810 630H1850"/>

  <!-- Skip connections -->
  <path class="skip" d="M570 726V785H1280V726"/>
  <text class="small" x="920" y="777" text-anchor="middle" font-weight="700">skip E2</text>
  <path class="skip" d="M350 726V835H1500V726"/>
  <text class="small" x="920" y="827" text-anchor="middle" font-weight="700">skip E1</text>

  <!-- Noise branch -->
  <g filter="url(#shadow)">
    <rect class="bottleneck" x="930" y="858" width="180" height="66" rx="14"/>
  </g>
  <text class="h1" x="1020" y="885" text-anchor="middle">Noise z<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <text class="mono" x="1020" y="912" text-anchor="middle">[B,32] → 4×4</text>
  <path class="noise-arrow" d="M1020 858V726"/>

</svg>
