<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1420" viewBox="0 0 2600 1420" role="img" aria-labelledby="title desc">
  <title id="title">FiLM-CNN generator architecture</title>
  <desc id="desc">Support- and coordinate-aware FiLM U-Net generator for five-minute implied-volatility-surface forecasting.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6D3AA8"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167D83"/>
    </marker>
    <filter id="soft-shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1F2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas { fill: #FFFFFF; }
      .title { font: 700 48px 'DejaVu Sans', Arial, sans-serif; fill: #172033; letter-spacing: .2px; }
      .subtitle { font: 400 23px 'DejaVu Sans', Arial, sans-serif; fill: #526071; }
      .panel-label { font: 700 21px 'DejaVu Sans', Arial, sans-serif; fill: #FFFFFF; letter-spacing: .5px; }
      .box-title { font: 700 24px 'DejaVu Sans', Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 20px 'DejaVu Sans', Arial, sans-serif; fill: #2F3C4D; }
      .box-text-small { font: 400 18px 'DejaVu Sans', Arial, sans-serif; fill: #2F3C4D; }
      .shape { font: 600 18px 'DejaVu Sans Mono', monospace; fill: #475569; }
      .formula { font: 400 22px 'DejaVu Serif', Georgia, serif; fill: #172033; }
      .note { font: 400 18px 'DejaVu Sans', Arial, sans-serif; fill: #556274; }
      .note-strong { font: 700 18px 'DejaVu Sans', Arial, sans-serif; fill: #26364A; }
      .arrow { fill: none; stroke: #243447; stroke-width: 4; marker-end: url(#arrow-dark); }
      .skip { fill: none; stroke: #5B6573; stroke-width: 4; marker-end: url(#arrow-dark); }
      .text-arrow { fill: none; stroke: #6D3AA8; stroke-width: 4; marker-end: url(#arrow-purple); }
      .text-bus { fill: none; stroke: #6D3AA8; stroke-width: 4; }
      .noise-arrow { fill: none; stroke: #167D83; stroke-width: 4; marker-end: url(#arrow-teal); }
      .input-box { fill: #F5F7FA; stroke: #697386; stroke-width: 3; }
      .encoder-box { fill: #EDF5FF; stroke: #2866B1; stroke-width: 3; }
      .bottleneck-box { fill: #E9F8F8; stroke: #17838A; stroke-width: 3; }
      .decoder-box { fill: #FFF4E8; stroke: #D66A13; stroke-width: 3; }
      .text-box { fill: #F6F0FC; stroke: #6D3AA8; stroke-width: 3; }
      .output-box { fill: #F7F7F8; stroke: #596574; stroke-width: 3; }
      .accent-line { stroke: #D7DEE8; stroke-width: 2; }
      .chip { fill: #6D3AA8; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="2600" height="1420"/>

  <!-- Title -->
  <text class="title" x="1300" y="62" text-anchor="middle">FiLM-CNN Generator Architecture</text>
  <text class="subtitle" x="1300" y="101" text-anchor="middle">Support- and coordinate-aware U-Net for 5-minute implied-volatility-surface forecasting</text>

  <!-- Text-conditioning branch -->
  <g filter="url(#soft-shadow)">
    <rect class="text-box" x="970" y="135" width="660" height="68" rx="14"/>
    <text class="box-title" x="1300" y="178" text-anchor="middle">LP text embedding  w<tspan baseline-shift="sub" font-size="16">t</tspan>  [B, 1024]</text>

    <rect class="text-box" x="840" y="237" width="920" height="110" rx="16"/>
    <text class="box-title" x="1300" y="273" text-anchor="middle">Text adapter</text>
    <text class="box-text" x="1300" y="307" text-anchor="middle">Linear 1024→256 · LayerNorm · LeakyReLU(0.2) · Dropout(0.1)</text>
    <text class="box-text" x="1300" y="335" text-anchor="middle">Linear 256→128 · LeakyReLU(0.2)</text>

    <rect class="text-box" x="1110" y="380" width="380" height="66" rx="14"/>
    <text class="box-title" x="1300" y="422" text-anchor="middle">e<tspan baseline-shift="sub" font-size="16">t</tspan>  [B, 128]</text>
  </g>
  <path class="text-arrow" d="M1300 203 V237"/>
  <path class="text-arrow" d="M1300 347 V380"/>

  <!-- Purple FiLM distribution bus, drawn behind modules -->
  <path class="text-bus" d="M1300 446 V476 H402"/>
  <path class="text-bus" d="M1300 476 H1722"/>
  <path class="text-arrow" d="M402 476 V515"/>
  <path class="text-arrow" d="M657 476 V515"/>
  <path class="text-arrow" d="M912 476 V515"/>
  <path class="text-arrow" d="M1190 476 V515"/>
  <path class="text-arrow" d="M1467 476 V515"/>
  <path class="text-arrow" d="M1722 476 V515"/>
  <rect class="chip" x="1530" y="450" width="155" height="36" rx="18"/>
  <text class="panel-label" x="1607.5" y="475" text-anchor="middle">6 FiLM sites</text>

  <!-- Main architecture boxes -->
  <g filter="url(#soft-shadow)">
    <rect class="input-box" x="28" y="548" width="215" height="280" rx="16"/>
    <rect class="encoder-box" x="300" y="548" width="205" height="280" rx="16"/>
    <rect class="encoder-box" x="555" y="548" width="205" height="280" rx="16"/>
    <rect class="encoder-box" x="810" y="548" width="205" height="280" rx="16"/>
    <rect class="bottleneck-box" x="1075" y="548" width="230" height="280" rx="16"/>
    <rect class="decoder-box" x="1365" y="548" width="205" height="280" rx="16"/>
    <rect class="decoder-box" x="1620" y="548" width="205" height="280" rx="16"/>
    <rect class="output-box" x="1875" y="548" width="170" height="280" rx="16"/>
    <rect class="output-box" x="2095" y="548" width="260" height="280" rx="16"/>
    <rect class="output-box" x="2405" y="548" width="170" height="280" rx="16"/>
  </g>

  <!-- Input box -->
  <text class="box-title" x="135.5" y="587" text-anchor="middle">4-channel input</text>
  <text class="shape" x="135.5" y="620" text-anchor="middle">[B, 4, 16, 16]</text>
  <line class="accent-line" x1="52" y1="642" x2="219" y2="642"/>
  <text class="box-text-small" x="135.5" y="679" text-anchor="middle">M<tspan baseline-shift="sub" font-size="13">t</tspan> ⊙ σ<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <text class="box-text-small" x="135.5" y="713" text-anchor="middle">support mask  M<tspan baseline-shift="sub" font-size="13">t</tspan></text>
  <text class="box-text-small" x="135.5" y="747" text-anchor="middle">moneyness  C<tspan baseline-shift="sub" font-size="13">m</tspan></text>
  <text class="box-text-small" x="135.5" y="781" text-anchor="middle">log-maturity  C<tspan baseline-shift="sub" font-size="13">log τ</tspan></text>

  <!-- Encoder boxes -->
  <text class="box-title" x="402.5" y="590" text-anchor="middle">Encoder E1</text>
  <text class="box-text-small" x="402.5" y="631" text-anchor="middle">3×3 Conv, s=1</text>
  <text class="box-text-small" x="402.5" y="665" text-anchor="middle">4 → 32</text>
  <line class="accent-line" x1="324" y1="686" x2="481" y2="686"/>
  <text class="box-text-small" x="402.5" y="723" text-anchor="middle">FiLM + LeakyReLU</text>
  <text class="shape" x="402.5" y="770" text-anchor="middle">[B, 32, 16, 16]</text>

  <text class="box-title" x="657.5" y="590" text-anchor="middle">Encoder E2</text>
  <text class="box-text-small" x="657.5" y="631" text-anchor="middle">3×3 Conv, s=2</text>
  <text class="box-text-small" x="657.5" y="665" text-anchor="middle">32 → 64</text>
  <line class="accent-line" x1="579" y1="686" x2="736" y2="686"/>
  <text class="box-text-small" x="657.5" y="723" text-anchor="middle">FiLM + LeakyReLU</text>
  <text class="shape" x="657.5" y="770" text-anchor="middle">[B, 64, 8, 8]</text>

  <text class="box-title" x="912.5" y="590" text-anchor="middle">Encoder E3</text>
  <text class="box-text-small" x="912.5" y="631" text-anchor="middle">3×3 Conv, s=2</text>
  <text class="box-text-small" x="912.5" y="665" text-anchor="middle">64 → 128</text>
  <line class="accent-line" x1="834" y1="686" x2="991" y2="686"/>
  <text class="box-text-small" x="912.5" y="723" text-anchor="middle">FiLM + LeakyReLU</text>
  <text class="shape" x="912.5" y="770" text-anchor="middle">[B, 128, 4, 4]</text>

  <!-- Bottleneck -->
  <text class="box-title" x="1190" y="590" text-anchor="middle">Bottleneck</text>
  <text class="box-text-small" x="1190" y="625" text-anchor="middle">concat: 128 + 32 = 160</text>
  <text class="box-text-small" x="1190" y="659" text-anchor="middle">3×3 Conv, s=1</text>
  <text class="box-text-small" x="1190" y="693" text-anchor="middle">160 → 128</text>
  <line class="accent-line" x1="1102" y1="712" x2="1278" y2="712"/>
  <text class="box-text-small" x="1190" y="746" text-anchor="middle">FiLM + LeakyReLU</text>
  <text class="shape" x="1190" y="790" text-anchor="middle">[B, 128, 4, 4]</text>

  <!-- Decoder boxes -->
  <text class="box-title" x="1467.5" y="590" text-anchor="middle">Decoder D1</text>
  <text class="box-text-small" x="1467.5" y="626" text-anchor="middle">bilinear ↑ to 8×8</text>
  <text class="box-text-small" x="1467.5" y="658" text-anchor="middle">concat E2: 192 ch.</text>
  <text class="box-text-small" x="1467.5" y="690" text-anchor="middle">3×3 Conv: 192→64</text>
  <line class="accent-line" x1="1389" y1="709" x2="1546" y2="709"/>
  <text class="box-text-small" x="1467.5" y="743" text-anchor="middle">FiLM + LeakyReLU</text>
  <text class="shape" x="1467.5" y="790" text-anchor="middle">[B, 64, 8, 8]</text>

  <text class="box-title" x="1722.5" y="590" text-anchor="middle">Decoder D2</text>
  <text class="box-text-small" x="1722.5" y="626" text-anchor="middle">bilinear ↑ to 16×16</text>
  <text class="box-text-small" x="1722.5" y="658" text-anchor="middle">concat E1: 96 ch.</text>
  <text class="box-text-small" x="1722.5" y="690" text-anchor="middle">3×3 Conv: 96→32</text>
  <line class="accent-line" x1="1644" y1="709" x2="1801" y2="709"/>
  <text class="box-text-small" x="1722.5" y="743" text-anchor="middle">FiLM + LeakyReLU</text>
  <text class="shape" x="1722.5" y="790" text-anchor="middle">[B, 32, 16, 16]</text>

  <!-- Head, reconstruction, output -->
  <text class="box-title" x="1960" y="590" text-anchor="middle">Residual</text>
  <text class="box-title" x="1960" y="621" text-anchor="middle">head</text>
  <text class="box-text-small" x="1960" y="670" text-anchor="middle">1×1 Conv</text>
  <text class="box-text-small" x="1960" y="704" text-anchor="middle">32 → 1</text>
  <text class="box-text-small" x="1960" y="738" text-anchor="middle">zero init.</text>
  <text class="shape" x="1960" y="786" text-anchor="middle">Δ<tspan baseline-shift="sub" font-size="13">t</tspan> [B,1,16,16]</text>

  <text class="box-title" x="2225" y="590" text-anchor="middle">Identity-anchored</text>
  <text class="box-title" x="2225" y="621" text-anchor="middle">softplus</text>
  <text class="formula" x="2225" y="678" text-anchor="middle" font-size="19">σ̂<tspan baseline-shift="sub" font-size="13">t+h</tspan> = σ<tspan baseline-shift="sub" font-size="13">t</tspan> + softplus(A<tspan baseline-shift="sub" font-size="13">t</tspan>+Δ<tspan baseline-shift="sub" font-size="13">t</tspan>)</text>
  <text class="formula" x="2225" y="716" text-anchor="middle" font-size="19">− softplus(A<tspan baseline-shift="sub" font-size="13">t</tspan>)</text>
  <text class="box-text-small" x="2225" y="773" text-anchor="middle" font-size="16">positive · persistence-anchored</text>

  <text class="box-title" x="2490" y="608" text-anchor="middle">Predicted</text>
  <text class="box-title" x="2490" y="639" text-anchor="middle">future IVS</text>
  <text class="shape" x="2490" y="699" text-anchor="middle">σ̂<tspan baseline-shift="sub" font-size="13">t+h</tspan></text>
  <text class="shape" x="2490" y="737" text-anchor="middle">[B,1,16,16]</text>
  <text class="box-text-small" x="2490" y="786" text-anchor="middle">h = 5 min</text>

  <!-- Main forward arrows -->
  <path class="arrow" d="M243 688 H300"/>
  <path class="arrow" d="M505 688 H555"/>
  <path class="arrow" d="M760 688 H810"/>
  <path class="arrow" d="M1015 688 H1075"/>
  <path class="arrow" d="M1305 688 H1365"/>
  <path class="arrow" d="M1570 688 H1620"/>
  <path class="arrow" d="M1825 688 H1875"/>
  <path class="arrow" d="M2045 688 H2095"/>
  <path class="arrow" d="M2355 688 H2405"/>

  <!-- U-Net skip connections -->
  <path class="skip" d="M657 828 V887 H1467 V828"/>
  <text class="note-strong" x="1062" y="878" text-anchor="middle">skip E2</text>
  <path class="skip" d="M402 828 V954 H1722 V828"/>
  <text class="note-strong" x="1062" y="945" text-anchor="middle">skip E1</text>

  <!-- Gaussian-noise branch -->
  <g filter="url(#soft-shadow)">
    <rect class="bottleneck-box" x="1091" y="988" width="198" height="112" rx="15"/>
  </g>
  <text class="box-title" x="1190" y="1028" text-anchor="middle">Gaussian noise</text>
  <text class="shape" x="1190" y="1062" text-anchor="middle">z<tspan baseline-shift="sub" font-size="13">t</tspan> [B, 32]</text>
  <text class="box-text-small" x="1190" y="1090" text-anchor="middle">broadcast to 4×4</text>
  <path class="noise-arrow" d="M1190 988 V828"/>

  <!-- FiLM detail inset -->
  <g filter="url(#soft-shadow)">
    <rect x="32" y="1032" width="930" height="328" rx="18" fill="#FBFAFD" stroke="#6D3AA8" stroke-width="3"/>
  </g>
  <rect class="chip" x="58" y="1056" width="270" height="40" rx="20"/>
  <text class="panel-label" x="193" y="1083" text-anchor="middle">FiLM at stage ℓ</text>

  <rect class="text-box" x="70" y="1130" width="184" height="68" rx="12"/>
  <text class="box-title" x="162" y="1172" text-anchor="middle">e<tspan baseline-shift="sub" font-size="16">t</tspan> [B,128]</text>
  <rect class="text-box" x="324" y="1118" width="242" height="92" rx="12"/>
  <text class="box-title" x="445" y="1153" text-anchor="middle">stage projection</text>
  <text class="box-text-small" x="445" y="1185" text-anchor="middle">Linear 128 → 2C<tspan baseline-shift="sub" font-size="13">ℓ</tspan></text>
  <rect class="text-box" x="636" y="1118" width="282" height="92" rx="12"/>
  <text class="box-title" x="777" y="1153" text-anchor="middle">γ<tspan baseline-shift="sub" font-size="16">t</tspan><tspan baseline-shift="super" font-size="16">(ℓ)</tspan>, β<tspan baseline-shift="sub" font-size="16">t</tspan><tspan baseline-shift="super" font-size="16">(ℓ)</tspan></text>
  <text class="box-text-small" x="777" y="1185" text-anchor="middle">channel-wise parameters</text>
  <path class="text-arrow" d="M254 1164 H324"/>
  <path class="text-arrow" d="M566 1164 H636"/>
  <text class="formula" x="495" y="1264" text-anchor="middle">H̃<tspan baseline-shift="super" font-size="16">(ℓ)</tspan> = (1 + γ<tspan baseline-shift="super" font-size="16">(ℓ)</tspan>) ⊙ H<tspan baseline-shift="super" font-size="16">(ℓ)</tspan> + β<tspan baseline-shift="super" font-size="16">(ℓ)</tspan></text>
  <text class="note" x="495" y="1307" text-anchor="middle">γ and β are broadcast over the 2-D grid; every FiLM projection is zero-initialized.</text>
  <text class="note" x="495" y="1337" text-anchor="middle">Therefore FiLM begins as the identity map: H̃<tspan baseline-shift="super" font-size="12">(ℓ)</tspan> = H<tspan baseline-shift="super" font-size="12">(ℓ)</tspan>.</text>

  <!-- Notes / legend -->
  <g transform="translate(1370 1030)">
    <text class="box-title" x="0" y="32">Architectural properties</text>
    <line class="accent-line" x1="0" y1="52" x2="1120" y2="52"/>

    <circle cx="14" cy="94" r="8" fill="#2866B1"/>
    <text class="note" x="36" y="101">Encoder preserves local moneyness–maturity structure.</text>
    <circle cx="14" cy="136" r="8" fill="#6D3AA8"/>
    <text class="note" x="36" y="143">Text enters the Generator only through six layer-specific FiLM projections.</text>
    <circle cx="14" cy="178" r="8" fill="#167D83"/>
    <text class="note" x="36" y="185">Gaussian innovation is injected only at the 4×4 bottleneck.</text>
    <circle cx="14" cy="220" r="8" fill="#D66A13"/>
    <text class="note" x="36" y="227">Bilinear decoding and two skip connections restore the 16×16 grid.</text>
    <circle cx="14" cy="262" r="8" fill="#596574"/>
    <text class="note" x="36" y="269">No flattening and no dense reconstruction MLP.</text>
    <circle cx="14" cy="304" r="8" fill="#596574"/>
    <text class="note" x="36" y="311">Zero-initialized head makes the initial forecast equal to persistence.</text>
  </g>

  <!-- Minimal footer -->
  <text class="note" x="2575" y="1394" text-anchor="end">Executable specification: film_unet_mask_coords_v1, c32</text>
</svg>
