training:
  data_path: data/processed/svi-excel/20260410-174929/merged_vol_rq2_text.xlsx
  sheet_name: gan_input_ready
  text_embedding_mode: lp
  text_alignment_mode: matched
  text_permutation_seed: 20260722
  split_strategy: grouped_chronological
  split_manifest_path: ""
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  min_samples_for_training: 2

  normalize_current_surface: true
  normalize_target_delta: true
  normalize_text_embedding: true

  forecast_mode: stochastic_wgan
  conditioning_mode: film
  noise_dim: 128
  gen_base_channels: 112
  disc_base_channels: 112
  gen_res_blocks: 4
  disc_res_blocks: 2
  text_hidden_dim: 768
  text_out_dim: 384
  fusion_hidden_dim: 2048

  learning_rate: 2.0e-5
  generator_learning_rate: 2.0e-5
  discriminator_learning_rate: 1.0e-5
  beta_1: 0.5
  beta_2: 0.9
  critic_iter: 5
  lambda_gp: 20.0
  num_epochs: 30
  batch_size: 128

  lambda_adv: 0.1
  adv_warmup_epochs: 10
  lambda_calendar: 1.0
  lambda_butterfly: 1.0
  lambda_smooth: 0.1
  lambda_recon: 20.0
  recon_weight_mode: short_atm_band
  recon_atm_range: 0.06
  recon_atm_short_end_max_days: 90.0
  recon_atm_multiplier: 8.0
  use_calendar_constraint: true
  use_butterfly_constraint: true
  use_smooth_constraint: true
  use_recon_constraint: true

  use_atm_short_loss: true
  lambda_atm_short: 30.0
  atm_short_range: 0.06
  atm_short_max_days: 90.0

  eval_mc_samples: 32
  eval_reweight_beta_mode: fixed
  eval_reweight_beta: 10.0
  eval_aggregation_mode: weighted_mean
  eval_calibration_levels: [0.5, 0.8, 0.9]
  arbitrage_violation_tolerance: 1.0e-8

  checkpoint_metric: val_mae
  extra_checkpoint_metrics:
    - val_mae_gap_vs_current
    - val_short_atm_mae_gap_vs_current
    - val_atm_short_pure_mae_gap_vs_current
  checkpoint_warmup_epochs: 10
  use_early_stopping: true
  early_stopping_patience: 7
  early_stopping_min_delta: 0.0

  seed: 42
  cuda: true
  num_workers: 0
  output_root: ""
  checkpoints_path: ""
  metrics_path: ""
  save_every: 5

generate_result:
  mc_samples: 64
  reweight_beta_mode: fixed
  reweight_beta: 10.0
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  calibration_levels: [0.5, 0.8, 0.9]
  arbitrage_violation_tolerance: 1.0e-8
  split: test
  selection_mode: all
  selection_count: 0
  aggregation_mode: weighted_mean
  residual_blend_alpha: 1.0
  output_dir: rq1_test_json
  save_json: true
  save_plots: false
