training:
  data_path: data/processed/svi-excel/20260410-174929/merged_vol.xlsx
  sheet_name: gan_input_ready
  text_embedding_mode: hd
  train_ratio: 0.8
  min_samples_for_training: 2

  normalize_current_surface: true
  normalize_target_delta: true
  normalize_text_embedding: true

  noise_dim: 32
  gen_base_channels: 32
  disc_base_channels: 32
  gen_res_blocks: 1
  disc_res_blocks: 1
  text_hidden_dim: 256
  text_out_dim: 128
  fusion_hidden_dim: 512

  learning_rate: 0.0001
  generator_learning_rate: 0.0001
  discriminator_learning_rate: 0.0001
  beta_1: 0.5
  beta_2: 0.9
  critic_iter: 5
  lambda_gp: 10.0
  num_epochs: 100
  batch_size: 32

  lambda_calendar: 2.0
  lambda_butterfly: 2.0
  lambda_smooth: 0.1
  use_calendar_constraint: true
  use_butterfly_constraint: true
  use_smooth_constraint: true

  eval_mc_samples: 32
  eval_reweight_beta_mode: fixed
  eval_reweight_beta: 25.0
  eval_aggregation_mode: weighted_mean
  checkpoint_metric: val_mae_gap_vs_current

  seed: 42
  cuda: true
  num_workers: 0

  output_root: ""
  save_every: 10

generate_result:
  mc_samples: 64
  reweight_beta_mode: fixed
  reweight_beta: 25.0
  quantiles:
    - 0.05
    - 0.5
    - 0.95
  split: val
  selection_mode: all
  selection_count: 0
  aggregation_mode: weighted_mean
  output_dir: ""
  save_json: true
  save_plots: true
