surface_builder:
  job: generate_surface
  option_data_glob: data/raw/option_data/0#TY+/0#TY+_202[23]-*.csv.gz
  output_dir: data/processed

  generate_surface:
    model: raw
    data_range: excel
    run_ts: ""
    output_dir: data/processed/${model}-${data_range}/${run_ts}
    input_glob: ${option_data_glob}
    expiration_time_utc: "20:00:00"
    output_json: ${output_dir}/surface-${model}-${data_range}.json
    log_file: ${output_dir}/surface-${model}-${data_range}.log
    resolved_config_path: ${output_dir}/surface-resolved_config.yaml
    data_date: "2026-03-09"
    days_in_year: 250
    min_strikes_per_expiry: 3
    min_expiries_per_minute: 2
    max_precalib_iv: 3.0
    max_files: 0
    max_minutes: 0
    chunk_size: 100000
    save_precalib_csv: true
    precalib_csv: ${output_dir}/surface-${model}-${data_range}-precalib-points.csv
    target_xlsx: data/raw/text_embedding/news_with_openai_embeddings_large.xlsx
    sheet_name: Sheet1
    date_column: PD
    time_column: ET
    source_timezone: Europe/London
    publication_availability_lag_minutes: 0
    max_target_datetimes: 0
    window_minutes: 5
    calibration_workers: 32
    pricing_model: black76
    rate_curve_path: data/reference/us_treasury_par_yield_curve_2022_2023.csv
    max_rate_staleness_days: 7
    max_underlying_staleness_seconds: 60
    underlying_match_mode: last_prior_trade
    option_filter_mode: otm_only
    iv_aggregation_mode: volume_weighted_median
    window_audit_json: ${output_dir}/window_temporal_audit.json
