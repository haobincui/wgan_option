surface_builder:
  # Unified entry selection for scripts/generate_surface/main.py when no explicit subcommand is passed.
  # Supported values:
  # daily-surface | minute-svi | minute-svi-window | minute-svi-excel
  job: minute-svi

  # Shared raw option data source for surface-related jobs.
  option_data_glob: data/raw/option_data/**/*.csv.gz
  output_dir: data/processed_vol

  # Daily surface generation settings (used by scripts/generate_surface/main.py daily-surface).
  daily_surface:
    # Falls back to surface_builder.option_data_glob when omitted.
    input_glob: ${option_data_glob}
    save_daily_csv: true
    npz_name: vol_surface_stack.npz
    strike_bins: 20
    maturity_bins: 20
    moneyness_min: 0.3
    moneyness_max: 1.7
    maturity_min_days: 1
    maturity_max_days: 365

  # Minute SVI generation settings (used by scripts/generate_surface/main.py minute-svi and related subcommands).
  minute_svi:
    # Falls back to surface_builder.option_data_glob when omitted.
    output_dir: data/processed
    input_glob: ${option_data_glob}
    expiration_time_utc: "20:00:00"
    output_json: ${output_dir}/minute_svi_params.json
    log_file: ${output_dir}/minute_svi_params.log
    data_date: "2026-03-09"
    days_in_year: 250
    min_strikes_per_expiry: 3
    min_expiries_per_minute: 1
    max_files: 0
    max_minutes: 0
    chunk_size: 100000
    save_precalib_csv: true
    precalib_csv: ${output_dir}/minute_svi_precalib_points.csv

  # Datetime-window specific settings (used by scripts/generate_surface/main.py minute-svi-window).
  minute_svi_window:
    # Either list target_datetimes here, or point target_datetimes_file to a text file.
    target_datetimes: []
    target_datetimes_file: ""
    window_minutes: 3

  # Excel-specific target datetime settings (used by scripts/generate_surface/main.py minute-svi-excel).
  minute_svi_excel:
    target_xlsx: data/raw/text_embedding/news_with_openai_embeddings_large.xlsx
    sheet_name: Sheet1
    date_column: PD
    time_column: ET
    source_timezone: America/New_York
    max_target_datetimes: 0
    window_minutes: 3
