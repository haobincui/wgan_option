surface_builder:
  # Unified entry selection for scripts/generate_surface/main.py when no explicit subcommand is passed.
  # This default config is reserved for the historical daily-surface job.
  job: daily-surface

  # Shared raw option data source for surface-related jobs.
  option_data_glob: data/raw/option_data/**/*.csv.gz
  output_dir: data/processed

  # Daily surface generation settings (used by scripts/generate_surface/main.py daily-surface).
  daily_surface:
    # Falls back to surface_builder.option_data_glob when omitted.
    input_glob: ${option_data_glob}
    save_daily_csv: true
    npz_name: vol_surface_stack.npz
    strike_bins: 20
    maturity_bins: 20
    moneyness_min: 0.5
    moneyness_max: 1.5
    maturity_min_days: 1
    maturity_max_days: 365
