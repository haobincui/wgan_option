# Data
option_data_glob: data/raw/option_data/*.csv.gz
news_embedding_path: data/raw/text_embedding/news_with_openai_embeddings_large.xlsx
embedding_column: HD_embedding
news_date_column: PD
processed_cache_path: data/processed/bond_option_dataset.pt

# Surface grid
strike_bins: 16
maturity_bins: 16
moneyness_min: 0.7
moneyness_max: 1.3
maturity_min_days: 7
maturity_max_days: 365
prediction_horizon: 1
train_ratio: 0.8
min_samples_for_training: 2

# Proxy implied volatility normalization range
vol_floor: 0.03
vol_cap: 1.5

# Model dimensions
channels: 1
embedding_dim: 1024
noise_dim: 32
gen_hidden_dim: 512
disc_hidden_dim: 256

# Optimization
learning_rate: 0.0002
num_epochs: 100
batch_size: 16
beta_1: 0.5
beta_2: 0.9
discriminator_iter: 5
lambda_gp: 10.0

# Modified loss weights
lambda_recon: 10.0
lambda_calendar: 2.0
lambda_butterfly: 2.0
lambda_smooth: 0.1

# Runtime
seed: 42
cuda: true
num_workers: 0
use_cache: true

# Paths
models_path: outputs/checkpoints
outputs_path: outputs/checkpoints
samples_path: outputs/samples
metrics_path: outputs/metrics
save_every: 10
