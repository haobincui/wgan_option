# Data
data_path: data/processed_excel_20260330-01/merged_vol.xlsx
sheet_name: gan_input_ready
text_embedding_mode: hd
train_ratio: 0.8

# Model dimensions
channels: 1
embedding_dim: 1024
noise_dim: 32
gen_hidden_dim: 512
disc_hidden_dim: 256

# Optimization
learning_rate: 0.0002
use_reduce_lr_on_plateau: true
reduce_lr_factor: 0.5
reduce_lr_patience: 8
reduce_lr_min_lr: 1.0e-5
num_epochs: 100
batch_size: 16
beta_1: 0.5
beta_2: 0.9
discriminator_iter: 5
lambda_gp: 10.0

# Modified loss weights
lambda_recon: 10.0
lambda_calendar: 2.0
lambda_butterfly: 2.0
lambda_smooth: 0.1
use_calendar_constraint: true
use_butterfly_constraint: true
use_smooth_constraint: true

# Runtime
seed: 42
cuda: true
num_workers: 0
save_every: 10
use_early_stopping: false
early_stopping_patience: 10
early_stopping_min_delta: 0.0

# Paths
output_root: outputs/vol_xlsx
