news_first_vol_training:
  datasets:
    root: data/processed/rq3/news_first_vol_surfaces_q097_103_ttm01_38_exact_ttm_v1
    workbook_template: tolerance_{tolerance02}m/merged_vol.xlsx
    tolerances_minutes: [5, 30]
    common_evaluation_tolerance_minutes: 5
    sheet_name: gan_input_ready
    text_embedding_mode: lp
    seed: 42
    support_mask_mode: raw_joint
    text_ablation_modes: [real_text]
    text_shuffle_seed: 20260822

  split:
    development_train_end_utc: "2023-07-01T00:00:00Z"
    development_validation_end_utc: "2023-10-01T00:00:00Z"
    refit_train_end_utc: "2023-10-01T00:00:00Z"
    q4_start_utc: "2023-10-01T00:00:00Z"
    q4_end_utc: "2024-01-01T00:00:00Z"
    validation_mc_samples: 16
    q4_mc_samples: 64

  film_nolp_capacity_seed_sweep:
    enabled: true
    experiment_kind: film_nolp_capacity_seed_q4_refit
    generator_conditioning_mode: film_conv_bottleneck_concat_v1
    critic_conditioning_mode: lp_disabled_same_shape_v1
    capacity_profiles: [micro, tiny, small, medium, large, legacy]
    seeds: [42, 202, 404]
    tolerances_minutes: [5, 30]
    text_ablation_modes: [real_text]
    lr_profile: lr_5e_07
    initial_learning_rate: 5.0e-7
    scheduler_min_lr: 5.0e-8
    refit_mode: frozen_epoch_lr_replay_v1
    surface_grid_profile: exact_ttm_16x16_v1
    strike_grid: [0.970, 0.974, 0.978, 0.982, 0.986, 0.990, 0.994, 0.998,
                  1.002, 1.006, 1.010, 1.014, 1.018, 1.022, 1.026, 1.030]
    maturity_days_grid: [1, 2, 3, 6, 7, 8, 9, 10, 14, 15, 17, 21, 26, 30, 35, 38]
    profiles:
      micro:
        gen_base_channels: 1
        gen_text_hidden_dim: 8
        gen_text_out_dim: 4
        gen_hidden_dim: 32
        disc_base_channels: 1
        disc_text_hidden_dim: 4
        disc_hidden_dim: 24
        expected_generator_parameters: 21164
        expected_critic_parameters: 4756
        expected_wgan_parameters: 25920
      tiny:
        gen_base_channels: 2
        gen_text_hidden_dim: 16
        gen_text_out_dim: 8
        gen_hidden_dim: 64
        disc_base_channels: 2
        disc_text_hidden_dim: 8
        disc_hidden_dim: 48
        expected_generator_parameters: 48828
        expected_critic_parameters: 10651
        expected_wgan_parameters: 59479
      small:
        gen_base_channels: 4
        gen_text_hidden_dim: 32
        gen_text_out_dim: 16
        gen_hidden_dim: 128
        disc_base_channels: 4
        disc_text_hidden_dim: 16
        disc_hidden_dim: 96
        expected_generator_parameters: 124424
        expected_critic_parameters: 25861
        expected_wgan_parameters: 150285
      medium:
        gen_base_channels: 8
        gen_text_hidden_dim: 64
        gen_text_out_dim: 32
        gen_hidden_dim: 256
        disc_base_channels: 8
        disc_text_hidden_dim: 32
        disc_hidden_dim: 192
        expected_generator_parameters: 356688
        expected_critic_parameters: 69961
        expected_wgan_parameters: 426649
      large:
        gen_base_channels: 12
        gen_text_hidden_dim: 96
        gen_text_out_dim: 48
        gen_hidden_dim: 384
        disc_base_channels: 12
        disc_text_hidden_dim: 48
        disc_hidden_dim: 288
        expected_generator_parameters: 697048
        expected_critic_parameters: 132301
        expected_wgan_parameters: 829349
      legacy:
        gen_base_channels: 32
        gen_text_hidden_dim: 256
        gen_text_out_dim: 128
        gen_hidden_dim: 1024
        disc_base_channels: 32
        disc_text_hidden_dim: 128
        disc_hidden_dim: 786
        expected_generator_parameters: 4020288
        expected_critic_parameters: 729157
        expected_wgan_parameters: 4749445
    expected_development_counts:
      5: {rows: 968, pairs: 748, sessions: 203}
      30: {rows: 1659, pairs: 1083, sessions: 237}
    expected_q3_counts:
      5: {rows: 148, pairs: 135, sessions: 33}
      30: {rows: 238, pairs: 186, sessions: 41}
    expected_refit_counts:
      5: {rows: 1116, pairs: 883, sessions: 236}
      30: {rows: 1897, pairs: 1269, sessions: 278}
    expected_q4_common_5m_counts: {rows: 167, pairs: 143, sessions: 45}
    analysis:
      bootstrap_replicates: 10000
      bootstrap_seed: 20260822
      selection_tolerance_minutes: 5
      one_se_rule: smallest_parameter_count_within_best_se
      q4_confirmation_label: retrospective_frozen_exploratory

  models:
    wgan:
      trainer_command: vol-xlsx
      training:
        train_ratio: 0.8
        channels: 1
        embedding_dim: 1024
        noise_dim: 32
        generator_noise_mode: gaussian
        generator_current_input_mode: current_support_masked
        generator_conditioning_mode: film_conv_bottleneck_concat_v1
        critic_conditioning_mode: lp_disabled_same_shape_v1
        critic_normalization_mode: legacy_instance_norm_v1
        gen_base_channels: 4
        gen_res_blocks: 0
        gen_text_hidden_dim: 32
        gen_text_out_dim: 16
        gen_hidden_dim: 128
        disc_base_channels: 4
        disc_res_blocks: 0
        disc_text_hidden_dim: 16
        disc_hidden_dim: 96
        residual_output_mode: identity_softplus_residual
        learning_rate: 5.0e-7
        generator_learning_rate: 5.0e-7
        discriminator_learning_rate: 5.0e-7
        lr_scheduler_type: none
        gradient_accumulation_steps: 1
        use_reduce_lr_on_plateau: true
        reduce_lr_factor: 0.5
        reduce_lr_patience: 3
        reduce_lr_min_lr: 5.0e-8
        num_epochs: 100
        batch_size: 16
        beta_1: 0.5
        beta_2: 0.9
        discriminator_iter: 5
        lambda_gp: 10.0
        lambda_recon: 10.0
        lambda_calendar: 2.0
        lambda_butterfly: 2.0
        lambda_smooth: 0.1
        lambda_delta_shrink: 0.0
        use_calendar_constraint: true
        use_butterfly_constraint: true
        use_smooth_constraint: true
        constraint_warmup_epochs: 0
        best_checkpoint_metric: val_hybrid_score
        evaluate_initial_checkpoint: true
        baseline_penalty_weight: 2.0
        use_early_stopping: true
        early_stopping_patience: 16
        early_stopping_min_epochs: 30
        early_stopping_min_delta: 0.0
        news_first_label_reliability_mode: none
        news_first_refit_mode: none
        news_first_refit_recipe_path: ""
        news_first_refit_recipe_sha256: ""
        news_first_materialize_validation_loader: true
        news_first_materialize_test_loader: false
        save_every: 1000000

  runtime:
    python_executable: /home/haobin_cui/.conda/envs/py312/bin/python
    gpu_ids: [0, 1]
    gpu_numa_nodes: {0: 0, 1: 1}
    slots_per_gpu: 18
    benchmark_workers_per_gpu: 18
    fallback_slots_per_gpu: 12
    cpu_threads_per_job: 1
    use_numa_binding: false
    numactl_executable: numactl
    nvidia_smi_executable: nvidia-smi
    resource_sample_interval_seconds: 2
    preflight_max_peak_gpu_memory_gib: 20.0
    preflight_max_host_ram_fraction: 0.85
