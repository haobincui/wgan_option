news_first_vol_surfaces:
  inputs:
    market_index_sqlite: data/processed/raw-market-index/raw_2022_2023_london_itm5_relaxed_v2/market_surface_index.sqlite
    pair_slice_metrics_csv: outputs/rq3/atm_skew_jumps_20260810_final/pair_slice_metrics.csv.gz
    session_calendar_csv: data/reference/cme_treasury_globex_closures_2022_2023.csv
    rate_curve_csv: data/reference/us_treasury_par_yield_curve_2022_2023.csv
    news_xlsx: data/raw/text_embedding/news_with_openai_embeddings_large.xlsx
    news_source_timezone: Europe/London

  analysis:
    tolerance_minutes: [5, 10, 15, 30]
    horizon_minutes: 5
    current_window_minutes: 5
    atm_qualities: [A, B]
    include_closed_in_training: false

  grid:
    strike_bins: 16
    maturity_bins: 16
    moneyness_min: 0.70
    moneyness_max: 1.30
    maturity_min_days: 7
    maturity_max_days: 365

  quality:
    pricing_model: black76
    min_strikes_per_expiry: 2
    min_expiries_per_surface: 2
    max_rate_staleness_days: 7
    max_underlying_staleness_seconds: 60
    underlying_match_mode: last_prior_trade
    option_filter_mode: otm_preferred_itm_fallback
    max_itm_moneyness_distance: 0.05
    iv_aggregation_mode: volume_weighted_median
    interpolation_policy: linear_percent_strike_and_linear_total_variance_by_maturity

  validation:
    enforce_expected_counts: true
    expected_news_rows: 14900
    expected_parsed_news_rows: 14900
    expected_market_pairs: 34450
    expected_counts_basis: pair_slice_metrics_first_evaluable_pair
    reconciliation_note: >-
      The 30m ATM counts are one above the preliminary full-surface trial.
      News row 14670 first encounters 14:49/14:54, which has no common
      maturity and is therefore outside the declared 34,450-pair universe;
      the first evaluable pair is 14:51/14:56 and has ATM quality A.
    expected_counts:
      "5":
        matched_open_news: 1628
        surface_usable_news: 1610
        surface_usable_timestamps: 1329
        surface_usable_pairs: 1283
        atm_ab_surface_news: 1311
        atm_ab_surface_timestamps: 1083
        atm_ab_surface_pairs: 1051
        atm_ab_news_maturity_rows: 1955
        atm_ab_pair_maturities: 1562
      "10":
        matched_open_news: 1992
        surface_usable_news: 1971
        surface_usable_timestamps: 1615
        surface_usable_pairs: 1508
        atm_ab_surface_news: 1568
