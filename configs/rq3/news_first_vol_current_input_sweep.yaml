news_first_vol_training:
  datasets:
    root: data/processed/rq3/news_first_vol_surfaces_q097_103_ttm07_38_v1
    workbook_template: tolerance_{tolerance02}m/merged_vol.xlsx
    tolerances_minutes: [5, 10, 15, 30]
    common_evaluation_tolerance_minutes: 5
    sheet_name: gan_input_ready
    text_embedding_mode: lp
    seed: 42
    support_mask_mode: raw_joint
    text_ablation_modes: [real_text]
    text_shuffle_seed: 42

  split:
    train_end_utc: "2023-07-01T00:00:00Z"
    validation_end_utc: "2023-10-01T00:00:00Z"
    validation_mc_samples: 16

  current_support_masked_seed_sweep:
    enabled: true
    experiment_kind: current_support_masked_seed_sweep
    experiment_stage: current_support_masked_wgan_small_three_seed
    q4_prediction_and_evaluation_forbidden: true
    q4_evaluator_calls: 0
    capacity_profile: small
    lr_profile: lr_5e_07
    seeds: [42, 202, 404]
    tolerances_minutes: [5, 30]
    text_ablation_mode: real_text
    generator_noise_mode: gaussian
    noise_dim: 32
    generator_current_input_mode: current_support_masked
    reference_generator_current_input_mode: full_current
    initial_learning_rate: 5.0e-7
    scheduler_min_lr: 5.0e-8
    expected_q3_pairs: 123
    expected_q3_sessions: 33
    epoch0_metric_absolute_tolerance: 1.0e-8

    full_current_reference:
      root: outputs/experiments/rq3_news_first_vol_coverage_completion_q097_103_ttm07_38_v1
      registry: outputs/experiments/rq3_news_first_vol_coverage_completion_q097_103_ttm07_38_v1/registry/jobs.json
      stage_qa: outputs/experiments/rq3_news_first_vol_coverage_completion_q097_103_ttm07_38_v1/registry/stages/stage_3_wgan_low_lr_capacity.qa.json
      resolved_config_hash: outputs/experiments/rq3_news_first_vol_coverage_completion_q097_103_ttm07_38_v1/registry/resolved_config.sha256
      q3_pair_metrics: outputs/experiments/rq3_news_first_vol_coverage_completion_q097_103_ttm07_38_v1/analysis/stages/stage_3_wgan_low_lr_capacity/q3_pair_metrics.csv.gz
      job_ids:
        - s3_wgan_small_lr_5e_07_seed_042_real_text_05m
        - s3_wgan_small_lr_5e_07_seed_042_real_text_30m
        - s3_wgan_small_lr_5e_07_seed_202_real_text_05m
        - s3_wgan_small_lr_5e_07_seed_202_real_text_30m
        - s3_wgan_small_lr_5e_07_seed_404_real_text_05m
        - s3_wgan_small_lr_5e_07_seed_404_real_text_30m

  models:
    wgan:
      trainer_command: vol-xlsx
      training:
        train_ratio: 0.8
        channels: 1
        embedding_dim: 1024
        noise_dim: 32
        generator_noise_mode: gaussian
        generator_current_input_mode: current_support_masked
        gen_base_channels: 4
        gen_res_blocks: 0
        gen_text_hidden_dim: 32
        gen_text_out_dim: 16
        gen_hidden_dim: 128
        disc_base_channels: 4
        disc_res_blocks: 0
        disc_text_hidden_dim: 16
        disc_hidden_dim: 96
        residual_output_mode: identity_softplus_residual
        learning_rate: 5.0e-7
        use_reduce_lr_on_plateau: true
        reduce_lr_factor: 0.5
        reduce_lr_patience: 3
        reduce_lr_min_lr: 5.0e-8
        num_epochs: 100
        batch_size: 16
        beta_1: 0.5
        beta_2: 0.9
        discriminator_iter: 5
        lambda_gp: 10.0
        lambda_recon: 10.0
        lambda_calendar: 2.0
        lambda_butterfly: 2.0
        lambda_smooth: 0.1
        lambda_delta_shrink: 0.0
        use_calendar_constraint: true
        use_butterfly_constraint: true
        use_smooth_constraint: true
        constraint_warmup_epochs: 0
        best_checkpoint_metric: val_hybrid_score
        evaluate_initial_checkpoint: true
        baseline_penalty_weight: 2.0
        use_early_stopping: true
        early_stopping_patience: 16
        early_stopping_min_epochs: 30
        early_stopping_min_delta: 0.0
        save_every: 1000000

  runtime:
    python_executable: /home/haobin_cui/.conda/envs/py312/bin/python
    gpu_ids: [0, 1]
    gpu_numa_nodes: {0: 0, 1: 1}
    slots_per_gpu: 2
    cpu_threads_per_job: 8
    use_numa_binding: true
    numactl_executable: numactl
    nvidia_smi_executable: nvidia-smi
    resource_sample_interval_seconds: 2
