# Base configuration for the single-seed FiLM-G + LP-Critic capacity pilot.
# The small profile is directly runnable. Other capacity cells use CLI width,
# profile, contract-hash, and output-root overrides; every run persists the
# fully resolved configuration beside its checkpoints.
train_ratio: 0.8
channels: 1
embedding_dim: 1024
noise_dim: 32
generator_noise_mode: gaussian
generator_current_input_mode: current_support_masked
generator_conditioning_mode: film_conv_bottleneck_concat_v1
critic_conditioning_mode: lp_concat_v1
critic_normalization_mode: legacy_instance_norm_v1
gen_base_channels: 4
gen_res_blocks: 0
gen_text_hidden_dim: 32
gen_text_out_dim: 16
gen_hidden_dim: 128
disc_base_channels: 4
disc_res_blocks: 0
disc_text_hidden_dim: 16
disc_hidden_dim: 96
residual_output_mode: identity_softplus_residual
learning_rate: 2.5e-7
generator_learning_rate: 2.5e-7
discriminator_learning_rate: 2.5e-7
lr_scheduler_type: none
gradient_accumulation_steps: 1
use_reduce_lr_on_plateau: true
reduce_lr_factor: 0.5
reduce_lr_patience: 3
reduce_lr_min_lr: 5.0e-8
num_epochs: 15
batch_size: 16
beta_1: 0.5
beta_2: 0.9
discriminator_iter: 5
lambda_gp: 10.0
lambda_recon: 10.0
lambda_calendar: 2.0
lambda_butterfly: 2.0
lambda_smooth: 0.1
lambda_delta_shrink: 0.0
use_calendar_constraint: true
use_butterfly_constraint: true
use_smooth_constraint: true
constraint_warmup_epochs: 0
best_checkpoint_metric: val_hybrid_score
evaluate_initial_checkpoint: true
baseline_penalty_weight: 2.0
use_early_stopping: true
early_stopping_patience: 16
early_stopping_min_epochs: 15
early_stopping_min_delta: 0.0
