training:
  protocol: independent_random_init_best_validation_v1
  critic_conditioning_mode: lp_disabled_same_shape_v1
  backbone_learning_rate: 5.0e-7
  text_learning_rate: 2.5e-6
  generator_optimizer_profile: conditioning_split_lr_v2
  conditioning_learning_rate: 2.5e-5
  critic_learning_rate: 5.0e-7
  num_epochs: 240
  early_stopping_min_epochs: 30
  early_stopping_patience: 20
  batch_size: 16
  discriminator_steps: 5
  validation_mc_samples: 16
  prediction_mc_samples: 64
  prediction_target_horizon_minutes: 5
  materialize_test_loader_during_training: false

analysis:
  bootstrap_replicates: 10000
  bootstrap_seed: 20260906
  confidence_level: 0.95
  resampling_hierarchy: seed_then_fold_then_paired_cme_session_v1
  primary_evaluation_panel: common_tolerance_05m_v1
  secondary_evaluation_panel: own_alignment_tolerance_v1
  primary_prediction_units: 120
  secondary_additional_prediction_units: 96
  expected_total_prediction_units: 216
  expected_total_evaluation_units: 324
  primary_between_model_family:
    id: film_vs_pure_cnn_by_training_tolerance
    size: 5
    estimand: log_mae_ratio_film_lp_matched_over_pure_cnn_no_text
    multiplicity: holm_5
  within_model_tolerance_families:
    - {model: film_lp_matched, reference_tolerance_minutes: 5, candidate_tolerances_minutes: [10, 15, 20, 30], multiplicity: holm_4}
    - {model: pure_cnn_no_text, reference_tolerance_minutes: 5, candidate_tolerances_minutes: [10, 15, 20, 30], multiplicity: holm_4}
  required_diagnostics: [persistence_skill, calendar_violation_rate, butterfly_violation_rate]
  required_text_interventions: [matched, zero]
  test_based_window_selection_permitted: false

