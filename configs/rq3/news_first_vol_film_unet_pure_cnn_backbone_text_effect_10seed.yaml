  generator_film_learning_rate: 2.5e-5
  discriminator_learning_rate: 5.0e-7
  generator_backbone_min_learning_rate: 5.0e-8
  generator_text_min_learning_rate: 2.5e-7
  generator_film_min_learning_rate: 2.5e-6
  discriminator_min_learning_rate: 5.0e-8
  group_scheduler_floor_ratio: 0.1
  reduce_lr_factor: 0.5
  reduce_lr_patience: 3
  lr_warmup_epochs: 0
  batch_size: 16
  discriminator_steps: 5
  beta_1: 0.5
  beta_2: 0.9
  lambda_gp: 10.0
  lambda_recon: 10.0
  lambda_calendar: 2.0
  lambda_butterfly: 2.0
  lambda_smooth: 0.1
  lambda_delta_shrink: 0.0
  constraint_warmup_epochs: 0
  baseline_penalty_weight: 2.0
  label_reliability_mode: none
  validation_mc_samples: 16
  prediction_mc_samples: 64
  shared_batch_order_within_seed_fold: true
  shared_training_noise_bank_within_seed_fold: true
  shared_prediction_noise_bank_within_seed_fold: true

