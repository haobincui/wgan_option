      - pure_cnn_continue_no_text
      - film_zero_text
      - film_lp_matched
      - film_lp_shuffle
      - film_bow
      - film_sentiment
    expected_cells: 280
    expected_pair_rows: 35000
  interventions:
    source_checkpoint_arm: film_lp_matched
    input_modes:
      - id: matched_checkpoint_zero_text_input
        representation: zero_vector_v1
      - id: matched_checkpoint_independent_lp_shuffle_input
        representation: lp_pair_mean_l2_v1
        pair_mapping: split_local_derangement_v1
        mapping_seed: 20260906
    mapping_must_differ_from_training_shuffle: true
    expected_cells: 80
    expected_pair_rows: 10000
  test_loader_allowed_before_freeze: false
  prediction_mc_samples: 64

analysis:
  interpretation: retrospective_rolling_development_text_effectiveness
  estimand: equal_seed_fold_mean_log_mae_ratio_v1
  bootstrap_replicates: 10000
  bootstrap_seed: 20260907
  confidence_level: 0.95
  resampling_hierarchy: seed_then_fold_then_paired_cme_session_v1
  multiple_testing_method: holm
  primary_family:
    family_size: 2
    contrasts:
      - id: film_lp_matched_vs_film_zero_text
        focal_arm: film_lp_matched
        reference_arm: film_zero_text
      - id: film_lp_matched_vs_film_lp_shuffle
        focal_arm: film_lp_matched
        reference_arm: film_lp_shuffle
  primary_support_gate:
    point_estimate_must_be_negative: true
    confidence_interval_upper_must_be_below_zero: true
    holm_adjusted_p_below: 0.05
    minimum_nonworse_seeds: 7
    minimum_nonworse_folds: 3
  descriptive_training_contrasts:
    - {id: film_lp_matched_vs_pure_cnn_continue, focal_arm: film_lp_matched, reference_arm: pure_cnn_continue_no_text}
    - {id: film_zero_text_vs_pure_cnn_continue, focal_arm: film_zero_text, reference_arm: pure_cnn_continue_no_text}
    - {id: film_lp_matched_vs_film_bow, focal_arm: film_lp_matched, reference_arm: film_bow}
    - {id: film_lp_matched_vs_film_sentiment, focal_arm: film_lp_matched, reference_arm: film_sentiment}
  intervention_contrasts:
    - matched_standard_vs_zero_text_input
    - matched_standard_vs_independent_lp_shuffle_input
  intervention_claim_scope: diagnostic_input_sensitivity_only
  persistence_comparisons_claim_scope: descriptive_secondary_only
  validation_snapshot_use: training_dynamics_diagnostic_only
  test_based_checkpoint_or_snapshot_selection_permitted: false
  expected_test_pairs_per_arm_seed: 500
  expected_test_sessions_per_arm_seed: 148

