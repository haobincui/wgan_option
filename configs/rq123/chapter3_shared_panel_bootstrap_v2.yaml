schema_version: 2
kind: chapter3_shared_market_panel_bootstrap_v2

# This is an analysis-only correction.  It must never be pointed at an existing
# experiment root or used to trigger training/prediction lifecycle actions.
output_root: outputs/analysis/chapter3_shared_market_panel_bootstrap_10000_v2

scope:
  included:
    - rq1_direct_rolling
    - rq2_direct_rolling
    - rq3_common_parent
    - rq3_validation_trajectory
    - generator_architecture_robustness
    - alignment_window_robustness
    - displayed_descriptive_capacity_and_coverage_lineage
  excluded:
    - rq4

bootstrap:
  iterations: 10000
  rng_seed: 20260904
  confidence_level: 0.95
  point_estimate: original_sample_plugin
  seed_resampling: with_replacement
  fold_resampling: with_replacement
  session_resampling: with_replacement
  market_weights: shared_across_all_sampled_seeds_and_paired_conditions
  resampling_contract: crossed_seed_by_market_panel_shared_fold_session_weights_v2

canonical_schema:
  required_columns: [condition, seed, fold, pair_id, session_id, value]
  optional_columns: [persistence_mae]
  value_definition: pair_level_masked_mae
  persistence_condition: persistence

recipes:
  folds: [f1_2023q1, f2_2023q2, f3_2023q3, f4_2023q4]
  direct:
    model_arms: [lp_matched, lp_shuffle, no_text, bow, sentiment]
    rq1_focal: lp_matched
    rq1_reference: no_text
    rq2_references: [bow, sentiment]
  rq3:
    full_conditions:
      - film_lp_matched
      - film_zero_text
      - film_lp_shuffle
      - film_bow
      - film_sentiment
      - pure_cnn_continue_no_text
      - pure_cnn_parent
    branch_focal: film_lp_matched
    branch_references: [film_lp_shuffle, film_zero_text]
    intervention_focal: matched_input
    intervention_references: [wrong_input, zero_input]
    validation_arms:
      - film_lp_matched
      - film_zero_text
      - film_lp_shuffle
      - pure_cnn_continue_no_text
    validation_checkpoints: [epoch_0, epoch_30, best]
  architecture:
    train_tolerance_minutes: 5
    panel_role: common_5m_primary
    formal_modes:
      - crossattn_unet_mask_coords_v1
      - transformer_tokens_mask_coords_v1
      - stylemod_unet_mask_coords_v1
    conditional_models:
      - film_reference
      - formal:crossattn_unet_mask_coords_v1
      - formal:stylemod_unet_mask_coords_v1
      - formal:transformer_tokens_mask_coords_v1
      - scaled:film_reference_scaled
      - scaled:validation_point_leader_scaled
  alignment:
    tolerances_minutes: [5, 10, 15, 20, 30]
    own_panel_tolerances_minutes: [10, 15, 20, 30]
    common_panel_role: common_5m_primary
    own_panel_role: own_tolerance_secondary

sources:
  direct:
    role: data
    adapter: simple_condition
    path: outputs/experiments/rq12_news_first_vol_text_10seed_composite_lr2p5e5_descriptive_no_bootstrap_exact_ttm_rolling_v1/analysis/text_10seed_composite_pair_metrics.csv
    sha256: d832b3b057ea440845bdd97312744bf5f75e706c80c2057a44d8f88e64f38754
    expected_rows: 25000
    expected_canonical_rows: 30000
    condition_column: arm
    value_column: target_mae
    persistence_column: persistence_mae
    add_persistence_condition: true
    panel_contract: shared
    expected_condition_count: 6
    expected_seed_count: 10
    expected_fold_count: 4
    expected_raw_values:
      arm: [lp_matched, lp_shuffle, no_text, bow, sentiment]

  rq3_full:
    role: data
    adapter: simple_condition
    path: outputs/experiments/rq12_news_first_vol_film_unet_pure_cnn_backbone_text_effect_10seed_5m_v1/evaluation/standard_pair_metrics.csv.gz
    sha256: 87e70dc0842c9fa99dcf98c40c9ec48c23ce1841a6e38f08559d5ea8e2db90e5
    expected_rows: 35000
    expected_canonical_rows: 40000
    condition_column: arm
    value_column: target_mae
    persistence_column: persistence_mae
    add_persistence_condition: true
    panel_contract: shared
    expected_condition_count: 8
    expected_seed_count: 10
    expected_fold_count: 4
    expected_raw_values:
      arm:
        - film_bow
        - film_lp_matched
        - film_lp_shuffle
        - film_sentiment
        - film_zero_text
        - pure_cnn_continue_no_text
        - pure_cnn_parent

  rq3_branch:
    role: data
    adapter: simple_condition
    path: outputs/experiments/rq12_news_first_vol_film_unet_pure_cnn_backbone_text_effect_10seed_5m_v1/analysis/standard_primary_panel.csv.gz
    sha256: 705783913e5252d8754cf9820ba9ca3c6a361dcc4fe6defec0fada40817cf041
    expected_rows: 15000
    expected_canonical_rows: 20000
    condition_column: arm
    condition_map: {matched: film_lp_matched}
    value_column: target_mae
    persistence_column: persistence_mae
    add_persistence_condition: true
    panel_contract: shared
    expected_condition_count: 4
    expected_seed_count: 10
    expected_fold_count: 4
    expected_raw_values:
      arm: [matched, film_lp_shuffle, film_zero_text]

  rq3_intervention:
    role: data
    adapter: simple_condition
    path: outputs/experiments/rq12_news_first_vol_film_unet_pure_cnn_backbone_text_effect_10seed_5m_v1/analysis/intervention_primary_panel.csv.gz
    sha256: 4898c79b51db2d7aacee8c749e14b2edf18e8920ce50c9c04d59375b4d77009b
    expected_rows: 15000
    expected_canonical_rows: 20000
    condition_column: input_condition
    value_column: target_mae
    persistence_column: persistence_mae
    add_persistence_condition: true
    panel_contract: shared
    expected_condition_count: 4
    expected_seed_count: 10
    expected_fold_count: 4
    expected_raw_values:
      input_condition: [matched_input, wrong_input, zero_input]

  rq3_validation:
    role: data
    adapter: validation_checkpoint
    path: outputs/experiments/rq12_news_first_vol_film_unet_pure_cnn_backbone_text_effect_10seed_5m_v1/evaluation/validation_trajectory_pair_metrics.csv.gz
    sha256: d63ffda5865f1316fbf58662843cecfa8d3e3dfb7b189d68152dddc93434dbc9
    expected_rows: 210420
    expected_adapted_data_rows: 60120
    expected_canonical_rows: 65130
    value_column: target_mae
    persistence_column: persistence_mae
    add_persistence_condition: true
    panel_contract: shared
    expected_condition_count: 13
    expected_seed_count: 10
    expected_fold_count: 4
    include:
      arm:
        - film_lp_matched
        - film_zero_text
        - film_lp_shuffle
        - pure_cnn_continue_no_text
      checkpoint_label: [epoch_0, epoch_30, best]

  architecture:
    role: data
    adapter: study_selector
    path: outputs/experiments/rq3_news_first_vol_generator_architecture_3seed_5m_exact_ttm_v1/predictions/pair_metrics.csv.gz
    sha256: 2e4716fc87ab860b3408e307493ca25a7e59c3b4c88ae7872458d8404f754bce
    expected_rows: 28500
    expected_canonical_rows: 30000
    value_column: target_mae
    persistence_column: persistence_mae
    add_persistence_condition: true
    panel_contract: shared
    expected_condition_count: 20
    expected_seed_count: 3
    expected_fold_count: 4
    expected_raw_values:
      train_tolerance_minutes: [5]
      panel_role: [common_5m_primary]
      text_condition: [matched, shuffle, zero]

  alignment:
    role: data
    adapter: study_selector
    path: outputs/experiments/rq3_news_first_vol_alignment_tolerance_3seed_exact_ttm_v1/predictions/pair_metrics.csv.gz
    sha256: c75fb74aa1504d43f6f8cd0926fc31559c3e6f9bf15d56ec0f40bf4a4980cb4a
    expected_rows: 46044
    expected_canonical_rows: 46044
    value_column: target_mae
    persistence_column: persistence_mae
    # This source contains multiple, nested own-tolerance panels.  Persistence
    # is therefore materialized only after build_jobs selects a single panel.
    add_persistence_condition: false
    panel_contract: mixed
    expected_condition_count: 27
    expected_seed_count: 3
    expected_fold_count: 4
    expected_raw_values:
      train_tolerance_minutes: [5, 10, 15, 20, 30]
      panel_role: [common_5m_primary, own_tolerance_secondary]
      text_condition: [matched, zero]

